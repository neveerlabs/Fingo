<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fingo</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/neveerlabs/Fingo/main/assets/favicon.png">
    <link rel="stylesheet" href="template/template.css">
    <link rel="stylesheet" href="css/index.css">
    <script defer src="template/template.js"></script>
    <script defer src="js/index.js"></script>
</head>
<body class="loading">
    <div id="loading-overlay">
        <div class="loader"></div>
        <p class="loading-text">Loading...</p>
    </div>

    <div class="balance-card">
        <div class="balance-header">
            <span class="net-worth">Net Worth</span>
            <button class="eye-btn" id="toggle-balance" aria-label="Tampilkan/sembunyikan saldo">
                <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eye-closed" class="active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
        </div>
        <div class="balance-amount" id="balance-amount">••••••</div>
        <div class="balance-details">
            <div class="balance-detail-item">
                <span class="detail-icon" id="wallet-detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4" /><path d="M4 6v12a2 2 0 0 0 2 2h14v-4" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></svg></span>
                <span class="detail-text" id="wallet-detail-text">Rp 0</span>
            </div>
            <div class="balance-detail-item">
                <span class="detail-icon" id="traffic-detail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7" /><polyline points="15 7 21 7 21 13" /></svg></span>
                <span class="detail-text" id="traffic-detail-text">Rp 0</span>
            </div>
        </div>
    </div>

    <!--<script src="template/template.js"></script>
    <script src="js/index.js"></script>-->
</body>
</html>
